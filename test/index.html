    <div id="editor"></div>
    <!-- Editor Dependencies -->
    <script src="../node_modules/codemirror/lib/codemirror.js"></script>
    <!-- Editor -->
    <script src="../tui.editor-editor-2.3.0/apps/editor/dist/cdn/toastui-editor-all.min.js"></script>
    <script src="../tui.editor-editor-2.3.0/plugins/color-syntax/dist/cdn/toastui-editor-plugin-color-syntax.js"></script>
    <script class="code-js">

      function loadHTML() {
        const element = document.getElementById('vcl5');
        window.element = element;
        const html = element.textContent;

        loadEditor(html);
      }

      function loadEditor(html){
        var plugins = [];
        var colorList = JSON.parse(`[{"color":"#000000","label":"Black text colour"},{"color":"#0000ff","label":"Template text colour"},{"color":"#28A197","label":"A2 user role text colour"},{"color":"#6F72AF","label":"B1 user role text colour"},{"color":"#F47738","label":"B2 user role text colour"},{"color":"#D53880","label":"B3 user role text colour"},{"color":"#D4351C","label":"D user role text colour"}]`);
        colorSyntaxOptions = {
                          color: "#000000",
                          preset: colorList,
                          useCustomSyntax: false,
                          restrictedMode: false
                      };
        plugins.push([toastui.Editor.plugin.colorSyntax, colorSyntaxOptions]);


        var editor = new toastui.Editor({
          el: document.querySelector('#editor'),
          height: '800px',
          initialEditType: 'wysiwyg',
          plugins: plugins
        });

        editor.setHtml(html,false);
      }
      
      document.addEventListener('DOMContentLoaded', () => {
        loadHTML();
      });
    </script>

    <p>Dear James,</p>

    <p>My name is <span style="color:blue">JP CIN4</span> and I
        am the Crown Prosecution Service (CPS) Victim Service Officer on the case that
        <span style="color:blue">[you/was]</span> reported to the police.
    </p>

    <div data-ai-generated="true">
        <p>I am sorry to learn about what you have been through and the distress caused by the repeated contact and behaviour over those four days. Thank you for sharing your experience with us.</p>
    </div>

    <p>
        The role of the CPS involves regularly reviewing the case and deciding whether the evidence we received from the
        police is enough to support the offences that have been charged. The prosecutor who reviewed this
        case is Sucheta Gupta. <span data-ai-generated="true">After reviewing the case, they have made the decision to alter the charges of </span>Stalking involving serious alarm / distress between 2 February 2025 and 6 February 2025 and Using disorderly behaviour, or threatening abusive or insulting words likely to cause harassment alarm or distress between 2 February 2025 and 6 February 2025<span data-ai-generated="true"> to a more suitable charge of </span><span data-ai-generated="true"><span style="color: blue">Stalking without fear, alarm, or distress between 2 February 2025 and 6 February 2025</span></span><span data-ai-generated="true">. This means that the behaviour is still considered stalking, but it no longer needs to meet the legal threshold for causing serious alarm, fear, or distress. The new charge remains a serious matter.</span>
    </p>

    <p>
        <b>
            How the decision has been made
        </b>
    </p>

    <p>
        The Crown Prosecution Service (CPS) does not make judgements on whether victims are telling the truth, or
        whether someone is innocent or guilty. We decide whether the suspect should be prosecuted.
    </p>

    <p>
        When making these decisions, prosecutors apply the legal test known as the Code
        for Crown Prosecutors. They review all the evidence and consider:
    </p>

    <ul>
        <li>
            First, is there enough evidence to provide a realistic prospect of conviction?
            In other words, is the suspect more likely than not to be found guilty?
        </li>
        <li>
            Second, if there is enough evidence, is it in the public interest that the case
            goes ahead?
        </li>
    </ul>

    <p>
        The Code is available on our website at this address:
        <a href="https://www.cps.gov.uk/publication/code-crown-prosecutors" rel="noreferrer" target="_blank" tabindex="0">https://www.cps.gov.uk/publication/code-crown-prosecutors</a>
    </p>

    <p>
        <b>
            Why the decision has been made
        </b>
    </p>

    

    <div data-ai-generated="true" data-summary-generated="true">
        For the charge of stalking involving serious alarm or distress, the prosecutor must be sure that the behaviour caused you significant alarm or distress and created substantial effects on your daily life.<span style="display:block;"></span>After reviewing the evidence, including your statement and medical reports, the prosecutor has concluded that there isn’t enough evidence to prove that the behaviour caused the level of harm required for this charge. While it is clear that the behaviour made you feel uneasy and anxious, there wasn’t sufficient proof of serious psychological harm or significant disruption to your daily life. Because of this, the original charge cannot proceed. However, the prosecutor has decided that there is enough evidence to bring a different charge of stalking without fear, alarm, or distress, as the behaviour was persistent and unwanted.<span style="display:block;"></span>The case was heard in court on 23 October 2025 at Humberside MC. The defendant pleaded guilty to this new charge and has now been sentenced. The sentence includes:<span style="display:block;"></span><ul>
<li>6 months in custody</li>
<li>100 hours of community service</li>
<li>A fine of £180</li>
</ul><span style="display:block;"></span>The case is now finalised, and you do not need to do anything further. The current bail conditions remain in place, which mean the defendant is not allowed to contact you or go near your home or workplace. If you have any concerns about your safety, please do not hesitate to reach out to the appropriate authorities. 
    </div>

    <p>
        <b>
            Further Support
        </b>
    </p>

    <ul class="spaced-list">
        <li>
            There are many support services available to you. This website may help you
            find support that is right for you:
            <a href="https://www.gov.uk/guidance/victim-and-witness-services#support-for-victims-and-witnesses-of-crime" rel="noreferrer" target="_blank" tabindex="0">https://www.gov.uk/guidance/victim-and-witness-services#support-for-victims-and-witnesses-of-crime</a>.
        </li>
        <li>
            If you would like to talk to someone not connected to the prosecution, you
            could contact Victim Support who offer free and confidential advice. Their
            contact number is <a href="tel:08081689111" tabindex="0">0808 1689111</a>. You can also
            log onto their website:
            <a href="https://www.victimsupport.org.uk/" rel="noreferrer" target="_blank" tabindex="0">https://www.victimsupport.org.uk/</a>.
        </li>
        <li>
            For more general, urgent support you can contact your local NHS Foundation
            Trust or the Samaritans:
            <ul>
                <li>
                    To find your local NHS service please visit
                    <a href="https://www.nhs.uk/service-search/mental-health/find-an-urgent-mental-health-helpline" rel="noreferrer" target="_blank" tabindex="0">https://www.nhs.uk/service-search/mental-health/find-an-urgent-mental-health-helpline
                    </a>
                    and answer two questions to find the right helpline.
                </li>
                <li>
                    The Samaritans provide a 24/7 listening service on <a href="tel:116123" tabindex="0">116 123</a>
                    where you can talk through your concerns, worries and troubles. You can also email
                    them on <a href="mailto:jo@samaritans.org" tabindex="0">jo@samaritans.org</a> or visit the
                    website for a wide range of support services including financial worries,
                    relationship and family problems and job-related stress
                    <a href="https://www.samaritans.org/" rel="noreferrer" target="_blank" tabindex="0">https://www.samaritans.org/</a>.
                </li>
            </ul>
        </li>
        <li style="color:blue">
            [LOCAL/RELEVANT SERVICES]
        </li>
    </ul>

    <p>
        <b>Further Information</b>
    </p>

    <ul class="spaced-list">
        <li>
            You have rights as a victim. These rights are explained in the Code of
            Practice for Victims of Crime, which you can find here:
            <a href="https://www.gov.uk/government/publications/the-code-of-practice-for-victims-of-crime" rel="noreferrer" target="_blank" tabindex="0">https://www.gov.uk/government/publications/the-code-of-practice-for-victims-of-crime</a>
        </li>
        <li>
            If you want to make a complaint or give feedback, you can do so here:
            <a href="https://contact.cps.gov.uk/" rel="noreferrer" target="_blank" tabindex="0">https://contact.cps.gov.uk/</a>
        </li>
        <li>
            If you are a victim of a crime, you may be able to get compensation. This
            link may help you to find out more:
            <ul>
                <li>
                    Claiming Compensation (please note time limits may apply):
                    <a href="https://www.victimandwitnessinformation.org.uk/claim-compensation/" rel="noreferrer" target="_blank" tabindex="0">https://www.victimandwitnessinformation.org.uk/claim-compensation/</a>
                </li>
            </ul>
        </li>
    </ul>

    <p>
        The CPS have commissioned Crest Advisory to conduct an evaluation of how
        the CPS engages with victims. Crest are an independent crime and justice
        consultancy who aim to improve criminal justice systems for everyone.
        As part of the evaluation, Crest would like to hear your views about the
        communications you have had with the CPS.
    </p>

    <p>
        Crest would like to invite you to <b>complete a survey to</b> provide your
        feedback. Taking part in the survey <b>allows your voice to be heard</b> in the
        evaluation and for the CPS to continue to <b>improve victim services</b>.
    </p>

    <p>
        <b>Who are Crest Advisory?</b><br>
        Crest Advisory are an independent crime and justice consultancy based in London.
        Their work aims to improve the criminal justice systems for everyone. They work
        with partners in the charity sector, the police, and government to create
        positive change - impacting both policy and practice. For more information,
        please visit <a href="https://www.crestadvisory.com" rel="noreferrer" target="_blank" tabindex="0">https://www.crestadvisory.com</a>.
    </p>

    <p>
        <b>What is the purpose of this survey?</b><br>
        The aim of this survey is to understand how well the CPS is communicating with
        victims, and what victims think of the service they receive from the CPS.
        To understand this, it is important to hear directly from victims. The
        results of this survey will be used to inform how the CPS communicates and
        engages with victims in future cases.
    </p>

    <p>
        <b>Who can participate in the survey?</b><br>
        You can participate in the survey if you are a victim who has received
        correspondence from the CPS about the CPS decision in the case.
    </p>

    <p>
        <b>Can someone support me in completing the survey?</b><br>
        You may find it useful to ask a friend, support worker, or carer to support you
        in completing a survey. If you do ask for support, it is important that your
        answer reflects your personal experience.
    </p>

    <p>
        <b>What will happen with the information I provide?</b><br>
        The information shared in this survey will be used to produce reports for the
        CPS to help the CPS to understand whether they are communicating with victims
        well and what could be improved.
    </p>


    <p>
        None of the information you provide will be used to identify you in the report.
        All the information in the report will remain anonymous. Please note, as your
        response is anonymous, Crest will not be able to delete your answers after
        you have submitted your survey response. This is because Crest will not be
        able to identify your response from all the other responses received.
    </p>

    <p>
        Crest Advisory will collect, store and securely keep any information you
        share in line with UK General Data Protection Regulation (UK GDPR) and
        the Data Protection Act (DPA). For more information about this, and for
        any requests to exercise your legal rights in relation to your personal
        data, please contact Crest’s Data Protection Officer (DPO):
    </p>

    <p>
        <b>Post: </b>Crest Advisory, 2 Bath Place, London, EC2A 3DA.<br>
        <b>Email: </b>cps-evaluation@crestadvisory.com<br>
    </p>
