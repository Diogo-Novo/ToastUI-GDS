<!doctype html>
<html>
  <head lang="en">
    <meta charset="UTF-8" />
    <title>Demo</title>
    <!-- Editor's Dependencies -->
    <link rel="stylesheet" href="../node_modules/codemirror/libcodemirror.css" />
    <!-- Editor -->
    <link rel="stylesheet" href="../tui.editor-editor-2.3.0/apps/editor/dist/toastui-editor.css" />
    <link rel="stylesheet" href="./test-styles.css" />
    <link rel="stylesheet" href="./color-plugin.css" />
    <style>
      .test-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
        font-family: sans-serif;
      }
      #out {
        width: 100%;
        box-sizing: border-box;
        margin-top: 8px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div class="test-toolbar">
      <label>Document <select id="doc"></select></label>
      <label>
        Load via
        <select id="mode">
          <option value="squire">Squire (getSquire().setHTML)</option>
          <option value="toastui">ToastUI (editor.setHtml)</option>
        </select>
      </label>
      <button id="reload">Reload file</button>
      <button id="roundtrip">Save → reload</button>
      <button id="dump">Show output</button>
      <span id="status"></span>
    </div>
    <div id="editor"></div>
    <textarea id="out" rows="12" placeholder="Press 'Show output' to see Squire's getHTML()"></textarea>
    <!-- Editor Dependencies -->
    <script src="../node_modules/codemirror/lib/codemirror.js"></script>
    <!-- Editor -->
    <script src="../tui.editor-editor-2.3.0/apps/editor/dist/cdn/toastui-editor-all.min.js"></script>
    <script src="../tui.editor-editor-2.3.0/plugins/color-syntax/dist/cdn/toastui-editor-plugin-color-syntax.js"></script>
    <script class="code-js">
      // Test documents live in ./fixtures/<name>.html and are listed in ./fixtures/manifest.json.
      // This page must be served over http (npm run test:serve); fetch() is blocked on file://.
      var editor;
      var params = new URLSearchParams(location.search);
      var docSelect = document.getElementById('doc');
      var modeSelect = document.getElementById('mode');
      var statusEl = document.getElementById('status');

      function loadEditor() {
        var plugins = [];
        var colorList = JSON.parse(`[{"color":"#000000","label":"Black text colour"},{"color":"#0000ff","label":"Template text colour"},{"color":"#28A197","label":"A2 user role text colour"},{"color":"#6F72AF","label":"B1 user role text colour"},{"color":"#F47738","label":"B2 user role text colour"},{"color":"#D53880","label":"B3 user role text colour"},{"color":"#D4351C","label":"D user role text colour"}]`);
        var colorSyntaxOptions = {
          color: '#000000',
          preset: colorList,
          useCustomSyntax: false,
          restrictedMode: false
        };
        plugins.push([toastui.Editor.plugin.colorSyntax, colorSyntaxOptions]);

        editor = new toastui.Editor({
          el: document.querySelector('#editor'),
          height: '800px',
          initialEditType: 'wysiwyg',
          plugins: plugins
        });
        window.editor = editor;
      }

      // Keep the current document and mode in the URL so a refresh (or live reload) stays put
      function updateUrl() {
        history.replaceState(null, '', '?doc=' + docSelect.value + '&mode=' + modeSelect.value);
      }

      async function loadDoc() {
        var name = docSelect.value;
        // no-store so edits to the fixture always show up, never a cached copy
        var response = await fetch('./fixtures/' + name + '.html', { cache: 'no-store' });

        if (!response.ok) {
          statusEl.textContent = 'Could not load fixtures/' + name + '.html (' + response.status + ')';
          return;
        }

        var html = await response.text();

        if (modeSelect.value === 'toastui') {
          editor.setHtml(html, false);
        } else {
          editor.getSquire().setHTML(html);
        }
        statusEl.textContent = 'Loaded ' + name + ' via ' + modeSelect.value;
      }

      async function initDocs() {
        var names = await (await fetch('./fixtures/manifest.json', { cache: 'no-store' })).json();

        docSelect.innerHTML = names.map((name) => '<option>' + name + '</option>').join('');
        docSelect.value = names.indexOf(params.get('doc')) > -1 ? params.get('doc') : names[0];
        modeSelect.value = params.get('mode') === 'toastui' ? 'toastui' : 'squire';

        docSelect.onchange = modeSelect.onchange = () => {
          updateUrl();
          loadDoc();
        };
        loadDoc();
      }

      document.getElementById('reload').onclick = loadDoc;

      document.getElementById('dump').onclick = () => {
        document.getElementById('out').value = editor.getSquire().getHTML();
      };

      // Equivalent to saving and reopening the document
      document.getElementById('roundtrip').onclick = () => {
        var squire = editor.getSquire();

        squire.setHTML(squire.getHTML());
        statusEl.textContent = 'Round-tripped ' + docSelect.value;
      };

      document.addEventListener('DOMContentLoaded', () => {
        if (location.protocol === 'file:') {
          statusEl.textContent = 'Open this page via `npm run test:serve`; fixtures cannot be fetched from file://';
        }
        loadEditor();
        initDocs();
      });
    </script>
  </body>
</html>
